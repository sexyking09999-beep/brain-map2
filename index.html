<script>
document.getElementById("h").textContent=SITE.name;document.getElementById("tg").textContent=SITE.tagline;
listArchive().then(function(v){var b=document.getElementById("recent");b.textContent="";
  if(!v.length){b.appendChild(el("p","empty","아직 올라온 카드뉴스가 없어요."));return}
  v.slice(0,4).forEach(function(it){b.appendChild(archiveCard(it))})})
 .catch(function(){var b=document.getElementById("recent");b.textContent="";b.appendChild(el("p","empty","카드뉴스를 불러오지 못했어요. 잠시 후 다시 시도해 주세요."))});
